<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website QR Generator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f7fa;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:500px;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,.1);
    text-align:center;
}

h2{
    margin-bottom:20px;
    color:#333;
}

input{
    width:100%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    outline:none;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#007bff;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

#qrcode{
    margin-top:20px;
}

#downloadBtn{
    display:none;
    margin-top:15px;
    background:green;
}
</style>
</head>
<body>

<div class="container">
    <h2>Website QR Generator</h2>

    <input type="text" id="url" placeholder="https://example.com">

    <button onclick="generateQR()">Generate QR</button>

    <div id="qrcode"></div>

    <button id="downloadBtn" onclick="downloadQR()">Download QR</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
function generateQR() {

    let url = document.getElementById("url").value.trim();

    if(url === ""){
        alert("Please enter website URL");
        return;
    }

    document.getElementById("qrcode").innerHTML = "";

    new QRCode(document.getElementById("qrcode"), {
        text: url,
        width: 250,
        height: 250
    });

    setTimeout(()=>{
        document.getElementById("downloadBtn").style.display="block";
    },500);
}

function downloadQR(){

    let img = document.querySelector("#qrcode img");

    if(img){
        let a = document.createElement("a");
        a.href = img.src;
        a.download = "website-qr.png";
        a.click();
    }
}
</script>

</body>
</html>
